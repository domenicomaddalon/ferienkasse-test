<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferienkasse 1.3 – Anmeldungstest</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div class="brand"><span class="logo">✈</span><div><strong>Ferienkasse 1.3</strong><small>Separater Anmeldungstest – keine Migration</small></div></div></header>
<main><section class="card"><h2>E-Mail-Einmalcode testen</h2><p class="muted">Diese Testseite verändert keine Daten der bestehenden Ferienkasse. Gemeinsame Reisen sind noch nicht aktiv.</p>
<form id="login"><label>E-Mail-Adresse<input id="email" type="email" autocomplete="email" required></label><button id="send" type="submit">Code anfordern</button></form>
<form id="verify" hidden><label>Code aus der E-Mail<input id="token" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" required></label><button type="submit">Code bestätigen</button></form>
<div id="signed" hidden><p>Angemeldet als <strong id="account"></strong></p><button id="logout" class="secondary">Abmelden</button></div>
<p id="status" class="muted" role="status" aria-live="polite"></p></section></main>
<script type="module" src="./auth-preview.js"></script></body></html>
