<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferienkasse 1.3 – Supabase-Reisen</title><link rel="stylesheet" href="./style.css"></head><body><header><div class="brand"><span class="logo">✈</span><div><strong>Ferienkasse 1.3</strong><small>Separater Supabase-Datenbanktest</small></div></div></header><main>
<section class="card"><h2>Supabase-Reisen testen</h2><p class="muted">Nur Testdaten. Die produktive Ferienkasse bleibt unverändert.</p><p id="account" class="muted">Anmeldung wird geprüft …</p><p id="status" role="status" aria-live="polite"></p><button id="login" class="secondary" hidden>Zur Anmeldung</button></section>
<section class="card" id="workspace" hidden><h2>Neue Reise</h2><form id="create"><label>Reisename<input id="name" required maxlength="200" placeholder="z. B. Tessin 2026"></label><label>Währung<select id="currency"><option>CHF</option><option>EUR</option><option>USD</option></select></label><button id="save" type="submit">Reise in Supabase speichern</button></form></section>
<section class="card" id="results" hidden><div class="heading"><h2>Meine Reisen</h2><button id="refresh" class="secondary">Aktualisieren</button></div><div id="trips"></div></section>
</main><script type="module" src="./trips-preview.js"></script></body></html>
